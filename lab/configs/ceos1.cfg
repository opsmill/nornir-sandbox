! Startup configuration for ceos1.
! Containerlab uses this file only when lab/clab-sandbox/ceos1/ does not exist yet:
! run `invoke down` (which removes that directory) before `invoke up` to apply changes.
hostname ceos1
username admin privilege 15 role network-admin secret admin
!
service routing protocols model multi-agent
!
interface Management0
   ip address 172.24.100.11/24
!
interface Ethernet1
   description to ceos2 Ethernet1
   no switchport
   ip address 10.0.12.0/31
!
interface Ethernet2
   description to ceos3 Ethernet2
   no switchport
   ip address 10.0.13.0/31
!
interface Ethernet3
   description to srl1 ethernet-1/1
   no switchport
   ip address 10.0.14.0/31
!
interface Loopback0
   ip address 10.255.0.1/32
!
ip routing
!
management api http-commands
   no shutdown
!
end
