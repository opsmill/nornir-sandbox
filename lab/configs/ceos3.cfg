! Startup configuration for ceos3.
! Containerlab uses this file only when lab/clab-sandbox/ceos3/ does not exist yet:
! run `invoke down` (which removes that directory) before `invoke up` to apply changes.
hostname ceos3
username admin privilege 15 role network-admin secret admin
!
service routing protocols model multi-agent
!
interface Management0
   ip address 172.24.100.13/24
!
interface Ethernet1
   description to ceos2 Ethernet2
   no switchport
   ip address 10.0.23.1/31
!
interface Ethernet2
   description to ceos1 Ethernet2
   no switchport
   ip address 10.0.13.1/31
!
interface Loopback0
   ip address 10.255.0.3/32
!
ip routing
!
management api http-commands
   no shutdown
!
end
