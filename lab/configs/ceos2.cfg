! Startup configuration for ceos2.
! Containerlab uses this file only when lab/clab-sandbox/ceos2/ does not exist yet:
! run `invoke down` (which removes that directory) before `invoke up` to apply changes.
hostname ceos2
username admin privilege 15 role network-admin secret admin
!
service routing protocols model multi-agent
!
interface Management0
   ip address 172.24.100.12/24
!
interface Ethernet1
   description to ceos1 Ethernet1
   no switchport
   ip address 10.0.12.1/31
!
interface Ethernet2
   description to ceos3 Ethernet1
   no switchport
   ip address 10.0.23.0/31
!
interface Ethernet3
   description to srl1 ethernet-1/2
   no switchport
   ip address 10.0.24.0/31
!
interface Loopback0
   ip address 10.255.0.2/32
!
ip routing
!
management api http-commands
   no shutdown
!
end
