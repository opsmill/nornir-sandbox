# Three Arista cEOS devices connected in a triangle, and one Nokia SR Linux device
# connected to ceos1 and ceos2.
#
#                     srl1
#              e1-1 /      \ e1-2
#             eth3 /        \ eth3
#             ceos1 -------- ceos2
#                  eth1  eth1
#             eth2 \        / eth2
#             eth2  \      /  eth1
#                     ceos3
#
# srl1 applies configs/srl1.cli on top of the SR Linux default configuration, and
# only when lab/clab-sandbox/srl1/ does not exist yet.
#
# inventory/hosts.yaml describes the same nodes, management addresses and
# links for Nornir. Change both files together; `invoke test` checks that
# they match.
name: sandbox

mgmt:
  network: sandbox-mgmt
  ipv4-subnet: 172.24.100.0/24

topology:
  kinds:
    ceos:
      image: null
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:24.10.1

  nodes:
    ceos1:
      kind: ceos
      mgmt-ipv4: 172.24.100.11
      startup-config: configs/ceos1.cfg
    ceos2:
      kind: ceos
      mgmt-ipv4: 172.24.100.12
      startup-config: configs/ceos2.cfg
    ceos3:
      kind: ceos
      mgmt-ipv4: 172.24.100.13
      startup-config: configs/ceos3.cfg
    srl1:
      kind: nokia_srlinux
      mgmt-ipv4: 172.24.100.21
      startup-config: configs/srl1.cli

  links:
    - endpoints: ["ceos1:eth1", "ceos2:eth1"]
    - endpoints: ["ceos1:eth2", "ceos3:eth2"]
    - endpoints: ["ceos2:eth2", "ceos3:eth1"]
    - endpoints: ["ceos1:eth3", "srl1:e1-1"]
    - endpoints: ["ceos2:eth3", "srl1:e1-2"]
