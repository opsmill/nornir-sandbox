[project]
name = "nornir-sandbox"
version = "0.1.0"
description = "Containerlab lab with three Arista cEOS devices and Nornir scripts to back up, run commands on, troubleshoot and validate it."
readme = "README.md"
authors = [{ name = "Damien Garros", email = "dgarros@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "cyclopts>=5.2.0",
    "invoke>=2.2",
    "nornir",
    "nornir-scrapli[asyncio]",
    "nornir-utils>=0.2",
]

# The asyncio runner (nornir-automation/nornir#1111) and the async scrapli connection
# and tasks (scrapli/nornir_scrapli#179) are not released yet. nornir-scrapli pins nornir
# to the same commit, so update both revisions together.
[tool.uv.sources]
nornir = { git = "https://github.com/nornir-automation/nornir", rev = "01bac1d326092489d688a72cd9d19569c6e1688a" }
nornir-scrapli = { git = "https://github.com/scrapli/nornir_scrapli", rev = "5ea33b7de9fa4fb035c76b2032bcd1e0d7660825" }

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pyyaml>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nornir_sandbox"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts", "tests", "tasks.py"]

[[tool.mypy.overrides]]
module = ["nornir_scrapli.*", "nornir_utils.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Each test creates a Nornir object, which configures logging again.
filterwarnings = ["ignore::nornir.core.exceptions.ConflictingConfigurationWarning"]
