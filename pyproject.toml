[project]
name = "nornir-sandbox"
version = "0.1.0"
description = "Containerlab lab with three Arista cEOS devices and one Nokia SR Linux device, and Nornir scripts to back up, run commands on, troubleshoot and validate it."
readme = "README.md"
authors = [{ name = "Damien Garros", email = "dgarros@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "cyclopts>=5.2.0",
    "invoke>=2.2",
    "netutils>=1.19.2",
    "nornir",
    "nornir-scrapli[asyncio]==1.6.0a1",
    "nornir-utils>=0.2",
    "pydantic>=2.7",
]

# Operations and their tasks, read by Nornir the first time a script runs an Operation.
# get_config has no task entry points: scripts/operations/backup_configs_*.py register
# its tasks with OperationRegistry.register() before they run it.
# Task names are <operation>.<platform>.<connection>: `scrapli` holds the async task and
# `scrapli_sync` the sync task (see src/nornir_sandbox/operations/__init__.py).
[project.entry-points."nornir.plugins.operations"]
get_facts = "nornir_sandbox.operations.contracts:GetFacts"
get_config = "nornir_sandbox.operations.contracts:GetConfig"
get_lldp_neighbors = "nornir_sandbox.operations.contracts:GetLldpNeighbors"
get_interfaces = "nornir_sandbox.operations.contracts:GetInterfaces"
set_interface_descriptions = "nornir_sandbox.operations.contracts:SetInterfaceDescriptions"

[project.entry-points."nornir.plugins.operation_tasks"]
"get_facts.cisco_iosxe.scrapli" = "nornir_sandbox.operations.ios:get_facts"
"get_config.cisco_iosxe.scrapli" = "nornir_sandbox.operations.ios:get_config"
"get_interfaces.cisco_iosxe.scrapli" = "nornir_sandbox.operations.ios:get_interfaces"
"get_facts.cisco_iosxe.scrapli_sync" = "nornir_sandbox.operations.ios:get_facts_sync"
"get_config.cisco_iosxe.scrapli_sync" = "nornir_sandbox.operations.ios:get_config_sync"
"get_lldp_neighbors.cisco_iosxe.scrapli" = "nornir_sandbox.operations.ios:get_lldp_neighbors"
"get_lldp_neighbors.cisco_iosxe.scrapli_sync" = "nornir_sandbox.operations.ios:get_lldp_neighbors_sync"
"get_interfaces.cisco_iosxe.scrapli_sync" = "nornir_sandbox.operations.ios:get_interfaces_sync"
"get_facts.arista_eos.scrapli" = "nornir_sandbox.operations.eos:get_facts"
"get_facts.arista_eos.scrapli_sync" = "nornir_sandbox.operations.eos:get_facts_sync"
"get_facts.nokia_srlinux.scrapli" = "nornir_sandbox.operations.srlinux:get_facts"
"get_facts.nokia_srlinux.scrapli_sync" = "nornir_sandbox.operations.srlinux:get_facts_sync"
"get_lldp_neighbors.arista_eos.scrapli" = "nornir_sandbox.operations.eos:get_lldp_neighbors"
"get_lldp_neighbors.arista_eos.scrapli_sync" = "nornir_sandbox.operations.eos:get_lldp_neighbors_sync"
"get_lldp_neighbors.nokia_srlinux.scrapli" = "nornir_sandbox.operations.srlinux:get_lldp_neighbors"
"get_lldp_neighbors.nokia_srlinux.scrapli_sync" = "nornir_sandbox.operations.srlinux:get_lldp_neighbors_sync"
"get_interfaces.arista_eos.scrapli" = "nornir_sandbox.operations.eos:get_interfaces"
"get_interfaces.arista_eos.scrapli_sync" = "nornir_sandbox.operations.eos:get_interfaces_sync"
"get_interfaces.nokia_srlinux.scrapli" = "nornir_sandbox.operations.srlinux:get_interfaces"
"get_interfaces.nokia_srlinux.scrapli_sync" = "nornir_sandbox.operations.srlinux:get_interfaces_sync"
"set_interface_descriptions.arista_eos.scrapli" = "nornir_sandbox.operations.eos:set_interface_descriptions"
"set_interface_descriptions.arista_eos.scrapli_sync" = "nornir_sandbox.operations.eos:set_interface_descriptions_sync"
"set_interface_descriptions.nokia_srlinux.scrapli" = "nornir_sandbox.operations.srlinux:set_interface_descriptions"
"set_interface_descriptions.nokia_srlinux.scrapli_sync" = "nornir_sandbox.operations.srlinux:set_interface_descriptions_sync"

# Operations (nornir-automation/nornir#1115, branch dga/feat-operation-s0e5v) are not
# released yet, so nornir comes from a Git commit of that branch, which is Nornir
# 3.7.0a1 plus Operations. That commit reports version 3.6.1, below the nornir>=3.7.0a1
# that nornir-scrapli 1.6.0a1 requires, so override-dependencies below replaces that
# requirement with the same commit. Change both nornir revisions together.
[tool.uv.sources]
nornir = { git = "https://github.com/nornir-automation/nornir", rev = "0a17a4f62cff4e9485f5be5ef77e92b662ccf078" }

[tool.uv]
override-dependencies = [
    "nornir @ git+https://github.com/nornir-automation/nornir@0a17a4f62cff4e9485f5be5ef77e92b662ccf078",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pyyaml>=6.0",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nornir_sandbox"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts", "tests", "tasks.py"]
plugins = ["pydantic.mypy"]

# Type-check the arguments of the Pydantic models' __init__ as their field types.
[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true

[[tool.mypy.overrides]]
module = ["nornir_scrapli.*", "nornir_utils.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Each test creates a Nornir object, which configures logging again.
filterwarnings = ["ignore::nornir.core.exceptions.ConflictingConfigurationWarning"]
